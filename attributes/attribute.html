<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="attribute.css">
    <title>Attributes selectors</title>
</head>
<body>
    <h2>Links</h2>
    <a href="https://www.flipkart.com/">Example Flipkart Link</a><br>
    <a href="https://www.google.com">Google</a><br>
    <a href="https://www.amazon.com">Amazon</a><br>
    <a href="https://www.linkedin.com/in/pushkar-raj-959427245/">LinkedIn</a><br>
    <h2>Forms</h2>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
